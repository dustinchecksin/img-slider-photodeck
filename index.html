<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Comparison Slider</title>
  <link rel="stylesheet" href="https://unpkg.com/img-comparison-slider@7/dist/styles.css">
  <script src="https://unpkg.com/img-comparison-slider@7/dist/index.js"></script>
</head>
<body style="margin: 0; padding: 0; width: 100%; height: 100vh; overflow: hidden;">
  <img-comparison-slider>
    <img slot="first" id="img1" />
    <img slot="second" id="img2" />
  </img-comparison-slider>

  <script>
    // Get images from URL params
    const params = new URLSearchParams(window.location.search);
    const img1Src = params.get('before');
    const img2Src = params.get('after');

    if (img1Src) document.getElementById('img1').src = img1Src;
    if (img2Src) document.getElementById('img2').src = img2Src;
  </script>

  <style>
    img-comparison-slider { width: 100%; height: 100%; }
  </style>
</body>
</html>
