<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Comparison Slider</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100%; height: 100vh; overflow: hidden; background: #000; }
    
    .comparison-slider {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    
    .comparison-slider img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .comparison-slider .img-before {
      z-index: 2;
      width: 50%;
      overflow: hidden;
    }
    
    .comparison-slider .img-before img {
      position: absolute;
      top: 0;
      left: 0;
    }
    
    .comparison-slider .divider {
      position: absolute;
      top: 0;
      left: 50%;
      width: 4px;
      height: 100%;
      background: rgba(255, 255, 255, 0.8);
      z-index: 3;
      cursor: ew-resize;
      transform: translateX(-50%);
    }
  </style>
</head>
<body>
  <div class="comparison-slider" id="slider">
    <div class="img-before" id="before">
      <img id="img1" />
    </div>
    <img id="img2" />
    <div class="divider" id="divider"></div>
  </div>

  <script>
    const slider = document.getElementById('slider');
    const before = document.getElementById('before');
    const divider = document.getElementById('divider');
    const img1 = document.getElementById('img1');
    const img2 = document.getElementById('img2');

    // Get images from URL params
    const params = new URLSearchParams(window.location.search);
    const img1Src = params.get('before');
    const img2Src = params.get('after');

    if (img1Src) img1.src = img1Src;
    if (img2Src) img2.src = img2Src;

    // Draggable slider logic
    let isActive = false;

    divider.addEventListener('mousedown', () => { isActive = true; });
    document.addEventListener('mouseup', () => { isActive = false; });
    document.addEventListener('mousemove', (e) => {
      if (!isActive) return;
      
      const rect = slider.getBoundingClientRect();
      let x = e.clientX - rect.left;
      
      x = Math.max(0, Math.min(x, rect.width));
      
      before.style.width = x + 'px';
      divider.style.left = x + 'px';
    });
  </script>
</body>
</html>
